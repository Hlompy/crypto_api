services:
  postgres:
    image: postgres:15
    container_name: crypto_postgres
    environment:
      POSTGRES_HOST: crypto_postgres
      POSTGRES_USER: hlompy
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: user_coins
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - crypto_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hlompy -d user_coins"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crypto_network
    env_file: .env

networks:
  crypto_network:
    driver: bridge

volumes:
  postgres_data: